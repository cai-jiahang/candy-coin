  function openZoom(){if(turning)return;const p=$('large-pages');p.className='';p.replaceChildren();for(const i of spreadPages(spread)){const im=new Image();im.src=urls[i];im.alt=i===LAST?'封底':`第 ${i+1} 页`;im.onclick=()=>p.classList.toggle('detail');p.append(im);}$('enlargement').showModal();closeTools();}

    resize();
    layOut();
    renderer.render(scene,camera);

    warm();
