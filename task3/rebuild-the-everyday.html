<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dedbd3"><title>重塑日常 · 翻阅</title>
<style>:root{font-family:Arial,"Microsoft YaHei",sans-serif;color:#4a453e;background:#dedbd3;color-scheme:light}*{box-sizing:border-box}body{margin:0;overflow:hidden}#reader{height:100dvh;width:100%;position:relative;overflow:hidden;background:#dedbd3}#viewport{position:absolute;inset:0;touch-action:none;cursor:grab}#viewport:active{cursor:grabbing}canvas{display:block;width:100%;height:100%;outline:0}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:1px solid #8f2925;outline-offset:4px}button:disabled{pointer-events:none}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;letter-spacing:2px;margin:0;padding:14px 20px;background:#dedbd3}#loading[hidden]{display:none}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.edge{position:absolute;top:30%;height:40%;width:5%;max-width:70px;opacity:0}.edge.left{left:0}.edge.right{right:0}#controls{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));right:28px;display:flex;align-items:center;gap:14px;opacity:0;transition:opacity .28s;z-index:5}#controls.visible,#controls:focus-within,#controls:hover{opacity:1}#controls>button{opacity:.48}#controls button{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;transition:background .15s,transform .15s}#controls button:hover{background:#c8c2b655;opacity:1}#controls button:active{transform:scale(.94)}#tools{display:flex;gap:7px;align-items:center;background:#e9e5ddde;backdrop-filter:blur(10px);border:1px solid #3a302513;border-radius:30px;padding:4px 7px}#tools[hidden]{display:none}dialog{border:1px solid #9c948633;background:#ebe7df;color:#4a453e;padding:44px 25px 25px;width:min(1040px,94vw);max-height:90dvh;box-shadow:0 20px 100px #0003}dialog::backdrop{background:#24211be0;backdrop-filter:blur(10px)}.close{position:fixed;right:max(4vw,calc((100vw - 1040px)/2 + 14px));top:6vh;width:36px;height:36px;font-size:29px;z-index:5;background:#ebe7dfd9;border-radius:50%}#thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 18px}.thumb{padding:0;text-align:left;font-size:10px;line-height:1.7}.thumb .preview{height:132px;display:flex;align-items:center;justify-content:center;padding:5px;border:1px solid transparent}.thumb img{max-width:100%;max-height:100%;box-shadow:0 4px 8px #0002}.thumb.active .preview{border-color:#922c28}.thumb span{display:block;margin-top:8px}.thumb:hover{color:#922c28}#enlargement{width:96vw;max-width:1600px;padding:30px 18px 18px;overflow:auto}#large-pages{display:flex;align-items:flex-start;justify-content:center;width:100%}#large-pages img{display:block;width:50%;height:auto;flex-shrink:0;cursor:zoom-in}#large-pages img:only-child{width:min(100%,750px)}#large-pages.detail{width:180%}#large-pages.detail img{cursor:zoom-out}#large-pages.detail img:only-child{width:65%}@media(max-width:650px){#controls{bottom:18px;right:15px}#thumbs{grid-template-columns:repeat(2,1fr)}.thumb .preview{height:115px}.close{right:5vw}#large-pages{flex-direction:column}#large-pages img,#large-pages img:only-child{width:100%}#large-pages.detail{width:200%}#large-pages.detail img:only-child{width:100%}.edge{width:7%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#viewport{touch-action:pan-y}
#flat-book{position:absolute;inset:0;display:grid;place-items:center;touch-action:pan-y}
#flat-book[hidden],#viewport[hidden]{display:none}
#flat-pages{display:flex;justify-content:center;align-items:center;width:min(88vw,103dvh)}
#flat-pages img{display:block;width:50%;aspect-ratio:3/4.1;object-fit:contain;box-shadow:0 6px 18px #231b1930}
#flat-pages img[hidden]{display:none}
#prev,#next{opacity:.58}
#prev:hover,#next:hover,#prev:focus-visible,#next:focus-visible{opacity:1}
#prev:disabled,#next:disabled{opacity:0}
</style>

<main id="reader" aria-label="重塑日常，可拖动书页或使用左右方向键翻阅">
  <div id="flat-book" aria-label="电子书">
    <div id="flat-pages">
      <img id="flat-left" hidden alt="">
      <img id="flat-right" src="book/cover-preview.jpg" fetchpriority="high" decoding="async" alt="重塑日常封面">
    </div>
  </div>
  <div id="viewport" aria-label="翻页书本" hidden></div>
  <span id="status" class="sr-only" aria-live="polite">封面</span>
  <button id="prev" class="edge left" aria-label="上一页" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
  <button id="next" class="edge right" aria-label="下一页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
  <div id="controls">
    <div id="tools" hidden>
      <button id="home" aria-label="回到封面" title="回到封面"><svg viewBox="0 0 24 24"><path d="M5 4v16M19 5 8 12l11 7z"/></svg></button>
      <button id="contents" aria-label="目录" title="目录"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
      <button id="zoom" aria-label="放大阅读" title="放大阅读"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5M7 10h6M10 7v6"/></svg></button>
      <button id="fullscreen" aria-label="全屏" title="全屏"><svg viewBox="0 0 24 24"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg></button>
    </div>
    <button id="more" aria-label="阅读工具" aria-expanded="false" title="阅读工具"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r=".7"/><circle cx="12" cy="12" r=".7"/><circle cx="19" cy="12" r=".7"/></svg></button>
  </div>
</main>
<dialog id="directory" aria-label="目录"><button class="close" data-close aria-label="关闭目录">×</button><div id="thumbs"></div></dialog>
<dialog id="enlargement" aria-label="放大阅读"><button class="close" data-close aria-label="关闭放大阅读">×</button><div id="large-pages"></div></dialog>
